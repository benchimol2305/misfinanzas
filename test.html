<!DOCTYPE html>
<html>
<head><title>Test Supabase</title></head>
<body>
<h2>Test de conexion Supabase</h2>
<pre id="result">Probando...</pre>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const supabaseUrl = 'https://lwfsbnrhucumvemkyafu.supabase.com';
  const supabaseKey = 'sb_publishable_p234YoJTqh0MVwbK3X24bA_L3qGNfez';
  const supabase = createClient(supabaseUrl, supabaseKey);

  const result = document.getElementById('result');

  try {
    // Test 1: Basic connectivity
    result.textContent = '1. Probando conexion basica...';
    const { data: settings, error: settingsErr } = await supabase.auth.getSession();
    result.textContent += '\ngetSession: ' + JSON.stringify(settings ? 'OK' : settingsErr?.message);

    // Test 2: Try signup
    result.textContent += '\n2. Probando registro...';
    const testEmail = 'test_' + Date.now() + '@test.com';
    const { data, error } = await supabase.auth.signUp({
      email: testEmail,
      password: 'testpass123'
    });
    result.textContent += '\nsignUp: ' + JSON.stringify(error ? error.message : 'OK - ' + data?.user?.id);

    result.textContent += '\n\nTODOS LOS TESTS COMPLETADOS';
  } catch (e) {
    result.textContent += '\n\nERROR CATCH: ' + e.message + '\n' + e.stack;
  }
</script>
</body>
</html>
